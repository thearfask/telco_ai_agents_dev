# TelecomTS alarm rules — V1 local generator
#
# Machine-readable rules for synthetic operational alarms.
# The Python generator is intentionally generic: KPI-specific thresholds live here.
#
# V1 execution note:
# - threshold rules are supported
# - absolute-threshold composite rules are supported
# - baseline_deviation and long-history rules are retained but deferred until
#   continuous per-cell timelines exist
# - BLER source values are multiplied by 100 before percentage-rule comparison
#
version: '1.0'
metrics:
  DL_BLER:
    multiplier: 100
    source_unit: fraction_like
    rule_unit: percent
    note: TelecomTS BLER values are normalized as fractions for rule comparison; multiply by 100 before
      applying percentage thresholds.
  UL_BLER:
    multiplier: 100
    source_unit: fraction_like
    rule_unit: percent
    note: TelecomTS BLER values are normalized as fractions for rule comparison; multiply by 100 before
      applying percentage thresholds.
  PRB_Utilization_DL:
    multiplier: 1
    source_unit: percent
    rule_unit: percent
  PRB_Utilization_UL:
    multiplier: 1
    source_unit: percent
    rule_unit: percent
  RSRP:
    multiplier: 1
    source_unit: dBm
    rule_unit: dBm
  UL_SNR:
    multiplier: 1
    source_unit: dB
    rule_unit: dB
  DL_MCS:
    multiplier: 1
    source_unit: index
    rule_unit: index
  UL_MCS:
    multiplier: 1
    source_unit: index
    rule_unit: index
  PRBs_DL_Current:
    multiplier: 1
    source_unit: count
    rule_unit: count
  UL_NPRB:
    multiplier: 1
    source_unit: count
    rule_unit: count
defaults:
  evaluation_window_seconds: 5
  minimum_samples: 10
  duplicate_suppression_seconds: 60
  sample_rate_hz: 10
rules:
- rule_id: RAN_RSRP_LOW_WARN
  enabled: false
  alarm:
    code: RAN-RSRP-LOW-WARN
    name: Low RSRP (Warning)
    source_system: RAN_PM
    component_type: CELL
  severity: WARNING
  metrics:
  - RSRP
  evaluation:
    type: threshold
    metric: RSRP
    operator: less_than
    threshold: -95
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: greater_than
    threshold: -93
    persistence_seconds: 10
  metadata:
    category: radio_quality
    unit: dBm
    threshold_type: vendor_operator
    explanation: '-95 dBm is a commonly used "good/fair" boundary in RAN engineering guidance. The -140..-44
      dBm reporting range itself is 3GPP standard (TS 36.133); this specific fault cutover is not.

      '
- rule_id: RAN_RSRP_LOW_CRIT
  enabled: false
  alarm:
    code: RAN-RSRP-LOW-CRIT
    name: Low RSRP (Critical)
    source_system: RAN_PM
    component_type: CELL
  severity: CRITICAL
  metrics:
  - RSRP
  evaluation:
    type: threshold
    metric: RSRP
    operator: less_than
    threshold: -110
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: greater_than
    threshold: -108
    persistence_seconds: 10
  metadata:
    category: radio_quality
    unit: dBm
    threshold_type: vendor_operator
    explanation: '-110 dBm is a commonly used cell-edge / poor-coverage cutover in RAN engineering guidance.
      Not a 3GPP-standardized fault threshold.

      '
- rule_id: RAN_DL_BLER_HIGH
  enabled: true
  alarm:
    code: RAN-DL-BLER-HIGH
    name: High Downlink Block Error Rate
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - DL_BLER
  evaluation:
    type: threshold
    metric: DL_BLER
    operator: greater_than
    threshold: 15
    persistence_seconds: 5
    minimum_samples: 50
  clear:
    operator: less_than
    threshold: 12
    persistence_seconds: 5
  metadata:
    category: radio_quality
    unit: percent
    threshold_type: vendor_operator
    explanation: 'Link adaptation commonly targets ~10% initial BLER as its design operating point; 15%
      sustained is used here as a fault-worthy excursion above that operating point. Not a single universal
      3GPP fault number.

      '
- rule_id: RAN_UL_BLER_HIGH
  enabled: true
  alarm:
    code: RAN-UL-BLER-HIGH
    name: High Uplink Block Error Rate
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - UL_BLER
  evaluation:
    type: threshold
    metric: UL_BLER
    operator: greater_than
    threshold: 15
    persistence_seconds: 5
    minimum_samples: 50
  clear:
    operator: less_than
    threshold: 12
    persistence_seconds: 5
  metadata:
    category: radio_quality
    unit: percent
    threshold_type: vendor_operator
    explanation: 'Same ~10% link-adaptation operating-point convention as downlink, applied to the uplink
      direction.

      '
- rule_id: RAN_UL_SNR_LOW_WARN
  enabled: true
  alarm:
    code: RAN-UL-SNR-LOW-WARN
    name: Low Uplink SNR (Warning)
    source_system: RAN_PM
    component_type: CELL
  severity: WARNING
  metrics:
  - UL_SNR
  evaluation:
    type: threshold
    metric: UL_SNR
    operator: less_than
    threshold: 5
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: greater_than
    threshold: 7
    persistence_seconds: 10
  metadata:
    category: radio_quality
    unit: dB
    threshold_type: vendor_operator
    explanation: 'SNR/SINR is not defined by a single 3GPP formula/range (it is vendor/chipset specific);
      5 dB reflects commonly used practical "marginal" framing within a roughly -20 to +30 dB practical
      range.

      '
- rule_id: RAN_UL_SNR_LOW_CRIT
  enabled: true
  alarm:
    code: RAN-UL-SNR-LOW-CRIT
    name: Low Uplink SNR (Critical)
    source_system: RAN_PM
    component_type: CELL
  severity: CRITICAL
  metrics:
  - UL_SNR
  evaluation:
    type: threshold
    metric: UL_SNR
    operator: less_than
    threshold: 0
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: greater_than
    threshold: 2
    persistence_seconds: 10
  metadata:
    category: radio_quality
    unit: dB
    threshold_type: vendor_operator
    explanation: '0 dB (noise-floor-comparable signal) reflects commonly used "critical/cell-edge" framing.
      Not 3GPP-standardized.

      '
- rule_id: RAN_DL_MCS_LOW
  enabled: true
  alarm:
    code: RAN-DL-MCS-LOW
    name: Sustained Low Downlink MCS
    source_system: RAN_PM
    component_type: CELL
  severity: MINOR
  metrics:
  - DL_MCS
  - PRBs_DL_Current
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: DL_MCS
      operator: less_than
      threshold: 6
    - metric: PRBs_DL_Current
      operator: greater_than
      threshold: 0
    persistence_seconds: 5
    minimum_samples: 50
  clear:
    operator: greater_than_or_equal
    threshold: 8
    persistence_seconds: 5
  metadata:
    category: scheduler
    unit: index
    threshold_type: simulation
    explanation: 'No universal "bad MCS number" exists; MCS is only meaningful when PRBs are actively
      scheduled, hence the composite gate on PRBs_DL_Current > 0. Index 6 is a configurable simulation
      default and must be reviewed against the assumed MCS table (64QAM vs 256QAM shift the meaningful
      range).

      '
- rule_id: RAN_UL_MCS_LOW
  enabled: true
  alarm:
    code: RAN-UL-MCS-LOW
    name: Sustained Low Uplink MCS
    source_system: RAN_PM
    component_type: CELL
  severity: MINOR
  metrics:
  - UL_MCS
  - UL_NPRB
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: UL_MCS
      operator: less_than
      threshold: 6
    - metric: UL_NPRB
      operator: greater_than
      threshold: 0
    persistence_seconds: 5
    minimum_samples: 50
  clear:
    operator: greater_than_or_equal
    threshold: 8
    persistence_seconds: 5
  metadata:
    category: scheduler
    unit: index
    threshold_type: simulation
    explanation: 'Same rationale as RAN_DL_MCS_LOW, applied to the uplink and gated on UL_NPRB > 0.

      '
- rule_id: RAN_PRB_UTIL_DL_HIGH
  enabled: true
  alarm:
    code: RAN-PRB-UTIL-DL-HIGH
    name: High Downlink PRB Utilization
    source_system: RAN_PM
    component_type: CELL
  severity: WARNING
  metrics:
  - PRB_Utilization_DL
  evaluation:
    type: threshold
    metric: PRB_Utilization_DL
    operator: greater_than
    threshold: 90
    persistence_seconds: 60
    minimum_samples: 300
  clear:
    operator: less_than
    threshold: 80
    persistence_seconds: 60
  metadata:
    category: radio_resource
    unit: percent
    threshold_type: vendor_operator
    explanation: '90% sustained utilization is a widely used capacity-watch cutover in RAN OSS dashboards;
      exact bands vary by vendor. This is an observational load alarm, not a congestion diagnosis (see
      the composite RAN_DL_CONGESTION rule for an impact-linked version).

      '
- rule_id: RAN_PRB_UTIL_UL_HIGH
  enabled: true
  alarm:
    code: RAN-PRB-UTIL-UL-HIGH
    name: High Uplink PRB Utilization
    source_system: RAN_PM
    component_type: CELL
  severity: WARNING
  metrics:
  - PRB_Utilization_UL
  evaluation:
    type: threshold
    metric: PRB_Utilization_UL
    operator: greater_than
    threshold: 90
    persistence_seconds: 60
    minimum_samples: 300
  clear:
    operator: less_than
    threshold: 80
    persistence_seconds: 60
  metadata:
    category: radio_resource
    unit: percent
    threshold_type: vendor_operator
    explanation: 'Same rationale as RAN_PRB_UTIL_DL_HIGH, applied to the uplink.

      '
- rule_id: RAN_UL_BUFFER_GROWTH
  enabled: true
  alarm:
    code: RAN-UL-BUFFER-GROWTH
    name: Growing Uplink Buffer Backlog
    source_system: RAN_PM
    component_type: CELL_UE
  severity: MINOR
  metrics:
  - Estimated_UL_Buffer
  evaluation:
    type: baseline_deviation
    metric: Estimated_UL_Buffer
    operator: percent_above_baseline
    threshold_percent: 100
    baseline_window_seconds: 300
    evaluation_window_seconds: 10
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: percent_above_baseline
    threshold_percent: 30
    persistence_seconds: 10
  metadata:
    category: scheduler
    unit: bytes
    threshold_type: simulation
    explanation: 'No universal absolute "large backlog" threshold exists; buffer occupancy is device/QoS-class
      dependent, so a rolling-baseline percent-deviation approach is used instead of a fixed byte value.

      '
- rule_id: RAN_RX_BYTES_DROP
  enabled: true
  alarm:
    code: RAN-RX-BYTES-DROP
    name: RX Throughput Drop vs Baseline
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - RX_Bytes
  evaluation:
    type: baseline_deviation
    metric: RX_Bytes
    operator: percent_below_baseline
    threshold_percent: 50
    baseline_window_seconds: 600
    evaluation_window_seconds: 30
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: percent_below_baseline
    threshold_percent: 20
    persistence_seconds: 30
  metadata:
    category: throughput
    unit: bytes_per_interval
    threshold_type: simulation
    explanation: 'RX_Bytes is a counter-type KPI with no universal absolute threshold; the generator must
      rate-convert (diff) before applying this rule. 50% below a 10-minute rolling baseline is a reasonable
      configurable starting point for a significant, likely service-affecting drop.

      '
- rule_id: RAN_TX_BYTES_DROP
  enabled: true
  alarm:
    code: RAN-TX-BYTES-DROP
    name: TX Throughput Drop vs Baseline
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - TX_Bytes
  evaluation:
    type: baseline_deviation
    metric: TX_Bytes
    operator: percent_below_baseline
    threshold_percent: 50
    baseline_window_seconds: 600
    evaluation_window_seconds: 30
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: percent_below_baseline
    threshold_percent: 20
    persistence_seconds: 30
  metadata:
    category: throughput
    unit: bytes_per_interval
    threshold_type: simulation
    explanation: 'Same rationale as RAN_RX_BYTES_DROP, applied to the transmit direction.

      '
- rule_id: RAN_DL_PACKETS_DROP
  enabled: true
  alarm:
    code: RAN-DL-PACKETS-DROP
    name: DL Packet Count Drop vs Baseline
    source_system: RAN_PM
    component_type: CELL
  severity: MINOR
  metrics:
  - DL_NumberOfPackets
  evaluation:
    type: baseline_deviation
    metric: DL_NumberOfPackets
    operator: percent_below_baseline
    threshold_percent: 50
    baseline_window_seconds: 600
    evaluation_window_seconds: 30
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: percent_below_baseline
    threshold_percent: 20
    persistence_seconds: 30
  metadata:
    category: traffic
    unit: packets_per_interval
    threshold_type: simulation
    explanation: 'Counter-type KPI; same baseline-deviation rationale as the byte counters, at MINOR severity
      since packet-count is a secondary corroborating signal to the byte-count alarms.

      '
- rule_id: RAN_UL_PACKETS_DROP
  enabled: true
  alarm:
    code: RAN-UL-PACKETS-DROP
    name: UL Packet Count Drop vs Baseline
    source_system: RAN_PM
    component_type: CELL
  severity: MINOR
  metrics:
  - UL_NumberOfPackets
  evaluation:
    type: baseline_deviation
    metric: UL_NumberOfPackets
    operator: percent_below_baseline
    threshold_percent: 50
    baseline_window_seconds: 600
    evaluation_window_seconds: 30
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: percent_below_baseline
    threshold_percent: 20
    persistence_seconds: 30
  metadata:
    category: traffic
    unit: packets_per_interval
    threshold_type: simulation
    explanation: 'Same rationale as RAN_DL_PACKETS_DROP, applied to the uplink.

      '
- rule_id: RAN_DL_RADIO_QUALITY_DEGRADED
  enabled: true
  alarm:
    code: RAN-DL-RADIO-QUALITY-DEGRADED
    name: Degraded Downlink Radio Quality
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - RSRP
  - DL_BLER
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: RSRP
      operator: less_than
      threshold: -105
    - metric: DL_BLER
      operator: greater_than
      threshold: 12
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: less_than_or_equal
    threshold: 1
    persistence_seconds: 10
  metadata:
    category: radio_quality
    threshold_type: vendor_operator
    explanation: 'Reports co-occurrence of low received power and elevated block error rate only; does
      not assert RSRP caused the BLER. See kpi_reference.md Section 3.1. Note: the "clear" block here
      is interpreted by convention as "clear when both underlying single-metric conditions have cleared,"
      implemented by the generator re-evaluating the same two conditions with their own clear thresholds
      (RSRP > -103, DL_BLER < 9) rather than a single numeric clear expression, since composite clears
      are documented in kpi_reference.md Section 5 as a generator-side convention.

      '
- rule_id: RAN_UL_RADIO_QUALITY_DEGRADED
  enabled: true
  alarm:
    code: RAN-UL-RADIO-QUALITY-DEGRADED
    name: Degraded Uplink Radio Quality
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - UL_SNR
  - UL_BLER
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: UL_SNR
      operator: less_than
      threshold: 5
    - metric: UL_BLER
      operator: greater_than
      threshold: 12
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: less_than_or_equal
    threshold: 1
    persistence_seconds: 10
  metadata:
    category: radio_quality
    threshold_type: vendor_operator
    explanation: 'Reports co-occurrence of low uplink SNR and elevated uplink block error rate only. See
      kpi_reference.md Section 3.2.

      '
- rule_id: RAN_DL_CONGESTION
  enabled: true
  alarm:
    code: RAN-DL-CONGESTION
    name: Downlink Resource Congestion
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - PRB_Utilization_DL
  - RX_Bytes
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: PRB_Utilization_DL
      operator: greater_than
      threshold: 90
    - metric: RX_Bytes
      operator: percent_below_baseline
      threshold_percent: 30
      baseline_window_seconds: 600
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: less_than
    threshold: 80
    persistence_seconds: 30
  metadata:
    category: radio_resource
    threshold_type: vendor_operator
    explanation: 'High utilization alone is "busy," not "congested." This rule requires high utilization
      to co-occur with falling delivered throughput relative to baseline before calling it congestion.
      See kpi_reference.md Section 3.3. Framed as "consistent with congestion," not a root-cause claim.

      '
- rule_id: RAN_UL_CONGESTION_STARVATION
  enabled: true
  alarm:
    code: RAN-UL-CONGESTION-STARVATION
    name: Uplink Resource Congestion / Starvation
    source_system: RAN_PM
    component_type: CELL
  severity: MAJOR
  metrics:
  - Estimated_UL_Buffer
  - UL_NPRB
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: Estimated_UL_Buffer
      operator: percent_above_baseline
      threshold_percent: 100
      baseline_window_seconds: 300
    - metric: UL_NPRB
      operator: less_than_or_equal
      threshold: 0
    persistence_seconds: 10
    minimum_samples: 50
  clear:
    operator: percent_above_baseline
    threshold_percent: 30
    persistence_seconds: 10
  metadata:
    category: scheduler
    threshold_type: simulation
    explanation: 'Growing backlog while granted resources are not increasing to serve it is consistent
      with congestion or scheduling starvation. See kpi_reference.md Section 3.4. The UL_NPRB condition
      here is simplified to "not currently scheduled" (<=0) for YAML expressibility; a stricter "flat-or-falling
      trend" version is documented in kpi_reference.md as a generator-side refinement.

      '
- rule_id: RAN_TRAFFIC_DEGRADATION_BOTH_DIRECTIONS
  enabled: true
  alarm:
    code: RAN-TRAFFIC-DEGRADATION-BOTH-DIRECTIONS
    name: Bidirectional Traffic Degradation
    source_system: RAN_PM
    component_type: CELL
  severity: CRITICAL
  metrics:
  - RX_Bytes
  - TX_Bytes
  evaluation:
    type: composite
    logic: AND
    conditions:
    - metric: RX_Bytes
      operator: percent_below_baseline
      threshold_percent: 50
      baseline_window_seconds: 600
    - metric: TX_Bytes
      operator: percent_below_baseline
      threshold_percent: 50
      baseline_window_seconds: 600
    persistence_seconds: 30
    minimum_samples: 100
  clear:
    operator: percent_below_baseline
    threshold_percent: 20
    persistence_seconds: 30
  metadata:
    category: traffic
    threshold_type: simulation
    explanation: 'Concurrent drop in both directions is a stronger service-affecting signal than either
      direction alone. See kpi_reference.md Section 3.5.

      '